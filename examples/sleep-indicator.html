<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Somnia sleep indicator</title>
<style>
  :root{--blue:#4C8DFF;--shimmer:#DCEBFF}
  html,body{margin:0}
  body{min-height:320px;display:grid;place-items:center;background:#f6f7f9;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .stage{display:flex;align-items:center;gap:10px;padding:28px 40px;background:#fff;border:1px solid #e8eaee;border-radius:16px;box-shadow:0 6px 24px rgba(20,30,60,.06)}
  .mem_sleep{display:flex;align-items:center;gap:9px;height:40px;font-size:20px;line-height:30px;color:var(--blue);user-select:none;white-space:nowrap}
  .mem_whale{width:22px;height:22px;flex:none;overflow:visible;transform-origin:35% 75%;animation:wag 3.4s ease-in-out infinite}
  .mem_shimmer{position:relative;display:inline-grid;width:max-content;max-width:100%;min-width:0;vertical-align:top;color:inherit}
  .mem_shimmer_content{display:flex;align-items:center;min-width:0}
  .mem_shimmer_text{color:inherit}
  .mem_shimmer_text[data-shimmer-text]:after{content:attr(data-shimmer-text)}
  .mem_shimmer_decoration{position:absolute;inset:0;overflow:clip;pointer-events:none;user-select:none}
  .mem_shimmer_sweep{position:absolute;inset:0;overflow:hidden;color:var(--shimmer);
    mask-image:linear-gradient(105deg,transparent 0%,black 40% 60%,transparent 100%);
    -webkit-mask-image:linear-gradient(105deg,transparent 0%,black 40% 60%,transparent 100%);
    transform:translate(-100%);animation:sweep 1.5s steps(48,end) .3s infinite}
  .mem_shimmer_highlight{width:100%;height:100%;transform:translate(100%);animation:highlight 1.5s steps(48,end) .3s infinite}
  .mem_zzz{position:relative;width:30px;height:20px;flex:none;margin-left:-2px;align-self:center}
  .mem_zzz i{position:absolute;left:0;font-style:italic;font-weight:600;line-height:1;color:var(--blue);
    animation:rise 2.4s ease-in-out infinite}
  .mem_zzz i:nth-child(1){font-size:9px;left:0;bottom:0;animation-delay:0s}
  .mem_zzz i:nth-child(2){font-size:9px;left:7px;bottom:4px;animation-delay:.3s}
  .mem_zzz i:nth-child(3){font-size:10px;left:14px;bottom:8px;animation-delay:.6s}
  @keyframes wag{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-6deg) translateY(-1px)}}
  @keyframes sweep{0%{transform:translate(-100%)}66.6667%,to{transform:translate(100%)}}
  @keyframes highlight{0%{transform:translate(100%)}66.6667%,to{transform:translate(-100%)}}
  @keyframes rise{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(4px,-4px)}}
</style>
</head>
<body>
  <div class="stage">
    <div class="mem_sleep">
      <svg class="mem_whale" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8.844 13.742C8.967 12.328 8.45 10.4 8.45 9.65C8.45 8.94 8.88 8.43 9.6 8.43C11.285 8.43 12.106 8.281 12.685 8.104C13.71 7.791 14.585 6.768 15.055 5.945C15.137 5.803 14.99 5.641 14.829 5.671C13.829 5.86 12.828 5.376 11.827 4.978C10.659 4.514 9.491 4.707 8.935 4.876C8.805 4.915 8.658 4.819 8.636 4.686C8.468 3.643 7.405 2.615 5.498 2.238C4.54 2.048 3.748 1.574 3.347 1.202C3.252 1.113 3.088 1.125 3.03 1.242C2.628 2.059 2.168 3.82 5.248 6.115C5.82 6.494 6.31 6.785 6.574 7.637C6.72 8.104 6.157 9.168 6.061 9.368C5.157 11.27 5.089 12.19 4.926 13.742" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </svg>
      <span class="mem_shimmer">
        <span class="mem_shimmer_content"><span class="mem_shimmer_text">deepseek 正在睡眠，已睡 10 分钟</span></span>
        <span class="mem_shimmer_decoration" aria-hidden="true" inert>
          <span class="mem_shimmer_sweep">
            <span class="mem_shimmer_content mem_shimmer_highlight">
              <span class="mem_shimmer_text" data-shimmer-text="deepseek 正在睡眠，已睡 10 分钟"></span>
            </span>
          </span>
        </span>
      </span>
      <span class="mem_zzz"><i>z</i><i>z</i><i>z</i></span>
    </div>
  </div>
</body>
</html>
